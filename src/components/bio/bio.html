<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-12 col-lg-7 text-center">

      <h1 class="section-title mb-5">Sobre Lobo Estoico</h1>

      <div class="bio-image-wrapper mb-4">
        <img src="img/daniel.png"
             alt="Daniel - creador de Lobo Estoico"
             class="bio-photo"
             (click)="onPhotoClick()"
             title="Daniel">
      </div>

      <h2 class="mb-4">{{ content().bioName }}</h2>

      <p class="bio-text lead">{{ content().bioParagraph1 }}</p>
      <p class="bio-text mt-3">{{ content().bioParagraph2 }}</p>

      <div class="mt-5">
        <a [href]="content().instagramUrl" target="_blank" class="btn btn-accent btn-lg">
          <i class="bi bi-instagram me-2"></i>Seguir en Instagram
        </a>
      </div>

    </div>
  </div>
</div>
